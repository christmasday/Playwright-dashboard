services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      # Database connection via Supabase Cloud
      DATABASE_URL: postgresql://postgres.ykfbmzrkaktzmwieamqx:8m2y8TGayqQBa%24.@aws-1-eu-west-1.pooler.supabase.com:6543/postgres
      SUPABASE_URL: https://ykfbmzrkaktzmwieamqx.supabase.co
      SUPABASE_KEY: 8m2y8TGayqQBa$
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-key
      FRONTEND_URL: http://localhost:5173
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

volumes:
  redis_data:
